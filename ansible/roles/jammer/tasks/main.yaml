---

- name: '"{{ item.identifier }}": derive jammer runtime values'
  ansible.builtin.set_fact:
    jammer_mode: "{{ item.jammer_config.mode | default('ramp') }}"
    jammer_run_id: "{{ item.identifier | regex_replace('[^A-Za-z0-9_.-]+', '_') | regex_replace('^[._]+|[._]+$', '') }}"

- name: '"{{ item.identifier }}": validate jammer configuration'
  ansible.builtin.assert:
    that:
      - jammer_mode in ['ramp', 'pulse_train', 'continuous']
      - item.jammer_config.start_delay_ms | default(0) | int >= 0
      - jammer_mode != 'ramp' or item.jammer_config.start_gain | float >= 0
      - jammer_mode != 'ramp' or item.jammer_config.end_gain | float >= 0
      - jammer_mode != 'ramp' or item.jammer_config.steps | int >= 0
      - jammer_mode != 'ramp' or item.jammer_config.on_duration | float > 0
      - jammer_mode != 'ramp' or item.jammer_config.off_duration | float > 0
      - jammer_mode == 'ramp' or item.jammer_config.gain | float >= 0
      - jammer_mode != 'pulse_train' or item.jammer_config.pulse_count | int >= 1
      - jammer_mode != 'pulse_train' or item.jammer_config.on_duration_ms | int >= 1
      - jammer_mode != 'pulse_train' or item.jammer_config.off_duration_ms | int >= 1
      - jammer_mode != 'pulse_train' or item.jammer_config.end_delay_ms | int >= 0
    fail_msg: "Invalid {{ jammer_mode }} jammer configuration"

- name: '"{{ item.identifier }}": stop previous jammer wrapper'
  ansible.builtin.systemd:
    name: jammer-wrapper.service
    state: stopped
  become: true
  failed_when: false
  delegate_to: 5g-core

- name: '"{{ item.identifier }}": reject an independently running stale wrapper'
  ansible.builtin.shell:
    cmd: >-
      test ! -f /run/jammer-wrapper/{{ jammer_run_id }}.json ||
      ! kill -0 "$(python3 -c 'import json; print(json.load(open("/run/jammer-wrapper/{{ jammer_run_id }}.json"))["pid"])')" 2>/dev/null
  args:
    executable: /bin/bash
  changed_when: false
  become: true
  delegate_to: 5g-core

- name: '"{{ item.identifier }}": deploy jammer API'
  ansible.builtin.copy:
    src: "../scripts/uhd_siggen_rest.py"
    dest: "/home/core/jammer-api.py"
    owner: core
    group: core
    mode: "0755"
  register: jammer_api_script
  become: true
  delegate_to: 5g-core

- name: '"{{ item.identifier }}": restart changed jammer API'
  ansible.builtin.systemd:
    name: jammer_api.service
    state: restarted
  when: jammer_api_script.changed
  become: true
  delegate_to: 5g-core

- name: '"{{ item.identifier }}": ensure jammer API is running'
  ansible.builtin.systemd:
    name: jammer_api.service
    state: started
  when: not jammer_api_script.changed
  become: true
  delegate_to: 5g-core

- name: '"{{ item.identifier }}": wait for jammer API health'
  ansible.builtin.uri:
    url: "http://127.0.0.1:5678/health"
    method: GET
    status_code: 200
    timeout: 2
  register: jammer_api_health
  until: jammer_api_health.status == 200
  retries: 30
  delay: 1
  delegate_to: 5g-core

- name: '"{{ item.identifier }}": force jammer off before arming'
  ansible.builtin.uri:
    url: "http://127.0.0.1:5678/off"
    method: GET
    status_code: 200
    timeout: 2
  failed_when: false
  delegate_to: 5g-core

- name: '"{{ item.identifier }}": deploy jammer wrapper'
  ansible.builtin.copy:
    src: "../scripts/jammer-wrapper.py"
    dest: "/home/core/jammer-wrapper.py"
    owner: core
    group: core
    mode: "0755"
  become: true
  delegate_to: 5g-core

- name: '"{{ item.identifier }}": install jammer wrapper service'
  ansible.builtin.copy:
    dest: /etc/systemd/system/jammer-wrapper.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=5G measurement jammer wrapper
      After=jammer_api.service
      Requires=jammer_api.service

      [Service]
      Type=simple
      User=core
      WorkingDirectory=/home/core
      EnvironmentFile=/etc/jammer-wrapper.env
      ExecStart=/usr/bin/python3 -u /home/core/jammer-wrapper.py --mode=${MODE} --run-id=${RUN_ID} --start_gain=${START_GAIN} --end_gain=${END_GAIN} --steps=${STEPS} --on=${ON_DURATION} --off=${OFF_DURATION} --gain=${GAIN} --pulse-count=${PULSE_COUNT} --start-delay-ms=${START_DELAY_MS} --on-duration-ms=${ON_DURATION_MS} --off-duration-ms=${OFF_DURATION_MS} --end-delay-ms=${END_DELAY_MS} --state-file=${STATE_FILE} --log-file=${LOG_FILE}
      ExecStop=-/usr/bin/curl -fsS http://127.0.0.1:5678/off
      ExecStopPost=-/usr/bin/curl -fsS http://127.0.0.1:5678/off
      KillSignal=SIGINT
      TimeoutStopSec=5
      Restart=no

      [Install]
      WantedBy=multi-user.target
  become: true
  delegate_to: 5g-core

- name: '"{{ item.identifier }}": create jammer runtime directory'
  ansible.builtin.file:
    path: /run/jammer-wrapper
    state: directory
    owner: core
    group: core
    mode: "0755"
  become: true
  delegate_to: 5g-core

- name: '"{{ item.identifier }}": remove stale jammer runtime files'
  ansible.builtin.file:
    path: "{{ jammer_runtime_file }}"
    state: absent
  loop:
    - "/run/jammer-wrapper/{{ jammer_run_id }}.json"
    - "/tmp/jammer-{{ jammer_run_id }}.csv"
  loop_control:
    loop_var: jammer_runtime_file
  become: true
  delegate_to: 5g-core

- name: '"{{ item.identifier }}": write jammer wrapper environment'
  ansible.builtin.copy:
    dest: /etc/jammer-wrapper.env
    owner: root
    group: root
    mode: "0644"
    content: |
      MODE={{ jammer_mode }}
      RUN_ID={{ jammer_run_id }}
      START_GAIN={{ item.jammer_config.start_gain | default(item.jammer_config.gain | default(0)) }}
      END_GAIN={{ item.jammer_config.end_gain | default(item.jammer_config.gain | default(0)) }}
      STEPS={{ item.jammer_config.steps | default(0) }}
      ON_DURATION={{ item.jammer_config.on_duration | default(1) }}
      OFF_DURATION={{ item.jammer_config.off_duration | default(1) }}
      GAIN={{ item.jammer_config.gain | default(item.jammer_config.start_gain | default(0)) }}
      PULSE_COUNT={{ item.jammer_config.pulse_count | default(1) }}
      START_DELAY_MS={{ item.jammer_config.start_delay_ms | default(0) }}
      ON_DURATION_MS={{ item.jammer_config.on_duration_ms | default(10) }}
      OFF_DURATION_MS={{ item.jammer_config.off_duration_ms | default(10) }}
      END_DELAY_MS={{ item.jammer_config.end_delay_ms | default(0) }}
      STATE_FILE=/run/jammer-wrapper/{{ jammer_run_id }}.json
      LOG_FILE=/tmp/jammer-{{ jammer_run_id }}.csv
  become: true
  delegate_to: 5g-core

- name: '"{{ item.identifier }}": reload systemd for jammer wrapper'
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
  delegate_to: 5g-core

- name: '"{{ item.identifier }}": start jammer wrapper'
  ansible.builtin.systemd:
    name: jammer-wrapper.service
    state: started
    enabled: false
  become: true
  delegate_to: 5g-core

- name: '"{{ item.identifier }}": wait for jammer wrapper to arm'
  ansible.builtin.slurp:
    src: "/run/jammer-wrapper/{{ jammer_run_id }}.json"
  register: jammer_wrapper_state
  until: >
    jammer_wrapper_state.content is defined and
    (jammer_wrapper_state.content | b64decode | from_json).status
    in ['armed', 'running', 'completed']
  retries: 50
  delay: 0.1
  become: true
  delegate_to: 5g-core

- name: '"{{ item.identifier }}": confirm continuous jammer is on'
  ansible.builtin.uri:
    url: "http://127.0.0.1:5678/status"
    method: GET
    status_code: 200
    return_content: true
    timeout: 2
  register: jammer_status
  until: >
    jammer_status.json.muted is defined and
    not jammer_status.json.muted and
    jammer_status.json.gain_or_power | float == item.jammer_config.gain | float
  retries: 20
  delay: 0.1
  ignore_errors: true
  when: jammer_mode == 'continuous'
  delegate_to: 5g-core
